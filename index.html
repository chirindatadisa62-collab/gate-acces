<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Access System - First Choice Group of Schools</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #60a5fa 100%);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Background student figures */
        .background-students {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .student-icon {
            position: absolute;
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .student-icon:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .student-icon:nth-child(2) { top: 20%; right: 15%; animation-delay: 1s; }
        .student-icon:nth-child(3) { top: 60%; left: 20%; animation-delay: 2s; }
        .student-icon:nth-child(4) { top: 70%; right: 10%; animation-delay: 3s; }
        .student-icon:nth-child(5) { top: 40%; left: 70%; animation-delay: 4s; }
        .student-icon:nth-child(6) { top: 80%; right: 30%; animation-delay: 5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .welcome-header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .welcome-header h1 {
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-weight: 300;
        }

        .welcome-header p {
            font-size: 1.2rem;
            margin: 10px 0 0 0;
            opacity: 0.9;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
            max-width: 500px;
            margin: 0 auto;
        }

        .gate-title {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 30px;
            font-size: 1.8rem;
            font-weight: 600;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            font-weight: 600;
            color: #374151;
            font-size: 1.1rem;
        }

        input[type="text"] {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            transition: all 0.3s ease;
            background-color: #f9fafb;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background-color: white;
        }

        button {
            padding: 15px;
            font-size: 18px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 58, 138, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .welcome-header h1 {
                font-size: 2rem;
            }
            .container {
                margin: 20px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="background-students">
        <div class="student-icon">👨‍🎓</div>
        <div class="student-icon">👩‍🎓</div>
        <div class="student-icon">👨‍🎓</div>
        <div class="student-icon">👩‍🎓</div>
        <div class="student-icon">👨‍🎓</div>
        <div class="student-icon">👩‍🎓</div>
    </div>

    <div class="welcome-header">
        <h1>Welcome to First Choice Group of Schools</h1>
        <p>School Gate Security System</p>
    </div>

    <div class="container">
        <div class="gate-title">Student Access Verification</div>
        <form method="POST">
            <label for="student_number">Enter Your Student Number:</label>
            <input type="text" id="student_number" name="student_number" required autofocus>
            <button type="submit">Check Access</button>
        </form>
    </div>
</body>
</html>
